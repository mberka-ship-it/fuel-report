name: Refresh and publish dashboard

on:
  schedule:
    - cron: "17 9 * * *"
      timezone: "Australia/Brisbane"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out dashboard
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install workbook reader
        run: python -m pip install --requirement requirements.txt

      - name: Download official source releases
        run: |
          fixture_dir="$RUNNER_TEMP/fuel-refresh"
          mkdir -p "$fixture_dir"
          curl --fail --location --retry 3 --retry-all-errors --connect-timeout 15 --max-time 120 \
            --user-agent "SEQ-fuel-security-monitor/2.0" \
            "https://fuelplan.gov.au/fuel-statistics" --output "$fixture_dir/fuelplan.html"
          wget --quiet --tries=3 --timeout=90 \
            --user-agent="SEQ-fuel-security-monitor/2.0" \
            --output-document="$fixture_dir/aps.html" \
            "https://www.energy.gov.au/publications/australian-petroleum-statistics-2026"
          curl --fail --location --retry 3 --retry-all-errors --connect-timeout 15 --max-time 120 \
            --user-agent "SEQ-fuel-security-monitor/2.0" \
            "https://www.dcceew.gov.au/sites/default/files/documents/mso-weekly-snapshot-timeseries.xlsx" --output "$fixture_dir/mso.xlsx"
          aps_url=$(python -c "from pathlib import Path; from scripts.refresh_dashboard import latest_aps_link; print(latest_aps_link(Path('$fixture_dir/aps.html').read_bytes())[0])")
          wget --quiet --tries=3 --timeout=120 \
            --user-agent="SEQ-fuel-security-monitor/2.0" \
            --output-document="$fixture_dir/aps.xlsx" \
            "$aps_url"
          echo "FUEL_REFRESH_FIXTURE_DIR=$fixture_dir" >> "$GITHUB_ENV"

      - name: Refresh official sources and dashboard payload
        run: python scripts/refresh_dashboard.py

      - name: Validate generated files
        run: python scripts/validate_dashboard.py

      - name: Record the checked snapshot
        run: |
          git config user.name "fuel-report-bot"
          git config user.email "fuel-report-bot@users.noreply.github.com"
          git add index.html data/snapshot.json
          git diff --cached --quiet || git commit -m "data: daily dashboard refresh"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Package site
        uses: actions/upload-pages-artifact@v5
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
